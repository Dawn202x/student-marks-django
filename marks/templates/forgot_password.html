{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'marks/css/style.css' %}">
</head>
<body>
    <div class="page">
        <h1>Reset Password</h1>
        <div class="card">
            {% if error %}<p style="color:#ff8a80;">{{ error }}</p>{% endif %}
            <form method="post">
                {% csrf_token %}
                <p><label>Username</label><input type="text" name="username" required></p>
                <p><label>PIN</label><input type="text" name="pin" maxlength="4" required></p>
                <p><label>New Password</label><input type="password" name="new_password" required></p>
                <button type="submit">Reset Password</button>
            </form>
        </div>
        <p style="margin-top:20px;"><a href="{% url 'login' %}" style="color:#82b1ff;">Back to login</a></p>
    </div>
</body>
</html>
