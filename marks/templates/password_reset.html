{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'marks/css/style.css' %}">
</head>
<body>
    <div class="page">
        <h1>Reset Password</h1>
        <div class="card">
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Send Reset Link</button>
            </form>
        </div>
        <p style="margin-top:20px;"><a href="{% url 'login' %}" style="color:#82b1ff;">Back to login</a></p>
    </div>
</body>
</html>
