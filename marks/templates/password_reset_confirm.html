{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
    <link rel="stylesheet" href="{% static 'marks/css/style.css' %}">
</head>
<body>
    <div class="page">
        <h1>Set a New Password</h1>
        <div class="card">
            {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Change Password</button>
                </form>
            {% else %}
                <p>This password reset link is invalid or has expired.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
