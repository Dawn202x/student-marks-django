{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'marks/css/style.css' %}">
</head>
<body>
    <div class="page">
        <h1>Create Account</h1>
        <div class="card">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Sign Up</button>
            </form>
        </div>
        <p style="margin-top:20px;"><a href="{% url 'login' %}" style="color:#82b1ff;">Already have an account? Log in</a></p>
    </div>
</body>
</html>
